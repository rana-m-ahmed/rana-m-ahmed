    <linearGradient id="scanFade" x1="0" x2="1"><stop offset="0" stop-color="#61a8ff" stop-opacity="0"/><stop offset=".5" stop-color="#61a8ff" stop-opacity=".08"/><stop offset="1" stop-color="#61a8ff" stop-opacity="0"/></linearGradient>
    <path id="e1" d="M750 116 C815 80 850 82 918 116"/><path id="e2" d="M750 116 C780 185 795 220 836 258"/><path id="e3" d="M918 116 C900 178 881 221 836 258"/><path id="e4" d="M918 116 C990 132 1030 168 1065 220"/><path id="e5" d="M836 258 C910 278 975 270 1065 220"/>
  </defs>
