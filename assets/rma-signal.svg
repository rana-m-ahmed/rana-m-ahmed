<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Rana Muhammad Ahmed — Applied AI and Software Engineer</title>
  <desc id="desc">Editorial technical profile banner showing a model, API, product, ship engineering flow.</desc>
  <style>
    .bg{fill:#070b10}.ink{fill:#eef3f8}.muted{fill:#93a1b2}.grid{stroke:#172231}.accent{fill:#61a8ff}.accent2{fill:#61ded2}.warm{fill:#f3c969}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    .edge{stroke:#172231;stroke-width:1.4;fill:none}.node{fill:#070b10;stroke:#61a8ff;stroke-width:1.6}.node2{fill:#070b10;stroke:#61ded2;stroke-width:1.6}
    @media (prefers-color-scheme: light){.bg{fill:#f4f1ea}.ink{fill:#111418}.muted{fill:#5f6670}.grid{stroke:#d9d4ca}.accent{fill:#0759d1}.accent2{fill:#087c7a}.warm{fill:#8b5e00}.edge{stroke:#d9d4ca}.node{fill:#f4f1ea;stroke:#0759d1}.node2{fill:#f4f1ea;stroke:#087c7a}}
    @media (prefers-reduced-motion: reduce){.motion,.pulse,.scan{display:none}}
  </style>
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2"/></filter>
